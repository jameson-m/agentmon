[package]
name = "agentmon"
version = "0.2.1"
edition = "2024"
description = "A terminal system monitor for running many Claude Code sessions"
license = "MIT"
repository = "https://github.com/jameson-m/agentmon"
readme = "README.md"
keywords = ["monitor", "tui", "claude", "agents"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.29.0"
libc = "0.2.191"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
